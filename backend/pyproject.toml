[project]
name = "recall-radar"
version = "0.1.0"
description = "Recall Radar backend: FastAPI API, Celery workers and the recall data pipeline."
readme = "README.md"
authors = [{ name = "Vivek Kasireddy" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "pydantic-settings>=2.4",
    "celery[redis]>=5.4",
    "httpx>=0.27",
]

[project.scripts]
recall-radar = "recall_radar.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # FastAPI's Depends() in defaults is idiomatic

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]  # autogenerated migrations

[tool.ruff.lint.isort]
# The local alembic/ folder would otherwise make ruff treat the library as first-party.
known-third-party = ["alembic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
